<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create User</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-brand">User CRUD</div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="create.html">Create</a>
    </nav>
  </header>

  <main class="app-shell">
    <a class="back-link" href="index.html">← Back to user list</a>

    <section class="detail-card">
      <h2>Create new user</h2>
      <form id="createForm" class="form-shell">
        <div class="form-field">
          <label for="firstName">First name</label>
          <input id="firstName" name="first_name" type="text" required />
        </div>
        <div class="form-field">
          <label for="lastName">Last name</label>
          <input id="lastName" name="last_name" type="text" required />
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>
        <div class="form-field">
          <label for="age">Age</label>
          <input id="age" name="age" type="number" min="0" required />
        </div>
        <div class="form-field">
          <label for="address">Address</label>
          <textarea id="address" name="address" required></textarea>
        </div>
        <div class="form-actions">
          <button class="button" type="submit">Save user</button>
          <a class="button" href="index.html">Cancel</a>
        </div>
        <p id="formStatus" class="status" style="margin-top: 0;"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>Add a new user record and save it to CRUD CRUD.</p>
  </footer>

  <script src="create.js"></script>
</body>
</html>
